name: Model CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
    
    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: rakez-lead-scoring
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    
    - name: Deploy to ECS
      run: |
        aws ecs update-service \
          --cluster rakez-ml-cluster \
          --service lead-scoring-service \
          --force-new-deployment
    
    - name: Update Databricks Model Registry
      run: |
        python scripts/update_databricks_model.py \
          --model-path models/lead_scoring.pkl \
          --stage Staging \
          --run-id ${{ github.run_id }}
    
    - name: Send deployment notification
      run: |
        python monitoring/alerts/slack_alerts.py \
          --message "✅ Model deployed to Staging" \
          --env staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Approve deployment
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.token }}
        approvers: team-leads
        minimum-approvals: 1
    
    - name: Deploy to production
      run: |
        python scripts/deploy_model.py \
          --environment production \
          --approval-id ${{ github.run_id }}
    
    - name: Run smoke tests
      run: |
        python tests/smoke_tests.py \
          --url https://api.rakez.com/v1/predict
    
    - name: Update MLflow registry
      run: |
        databricks jobs run-now \
          --job-id 123 \
          --notebook-params '{"action": "promote"}'
    
    - name: Send production alert
      run: |
        python monitoring/alerts/slack_alerts.py \
          --message "🚀 Model v${{ github.ref_name }} deployed to Production" \
          --env production \
          --channel #ml-alerts
